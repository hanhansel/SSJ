<!-- IMPORT PREVIEW SUMMARY: each card also filters the table rows (data-error / data-warning on each <tr>) -->
<div class="row g-3 mb-4">
    {% for filter_key, count, color, label in [
        ('all', total_parsed, 'text-primary', 'Total Read'),
        ('ready', total_parsed - total_errors, 'text-success', 'Ready to Import'),
        ('warning', total_warnings, 'text-warning', 'Warnings'),
        ('error', total_errors, 'text-danger', 'Errors'),
    ] %}
    <div class="col-md-3">
        <button type="button" class="clean-card import-filter-card mb-0 h-100 py-3 text-center w-100 {{ 'active' if filter_key == 'all' else '' }}"
                data-filter="{{ filter_key }}" title="Show {{ label|lower }}">
            <div class="fs-1 fw-bold {{ color }} import-filter-count">{{ count }}</div>
            <div class="small text-muted text-uppercase fw-bold mt-1">{{ label }}</div>
        </button>
    </div>
    {% endfor %}
</div>

<style>
.import-filter-card { border: 2px solid transparent; cursor: pointer; transition: border-color 0.15s; }
.import-filter-card:hover { border-color: #e2e8f0; }
.import-filter-card.active { border-color: #0071e3; }
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const shows = {
        all: row => true,
        ready: row => !row.dataset.error,
        warning: row => !!row.dataset.warning,
        error: row => !!row.dataset.error,
    };
    // Recounted when a row's flags change (the client picker can add or clear a warning or error).
    window.refreshImportSummary = function () {
        const rows = [...document.querySelectorAll('tr[data-import-row]')];
        document.querySelectorAll('.import-filter-card').forEach(card => {
            card.querySelector('.import-filter-count').textContent = rows.filter(shows[card.dataset.filter]).length;
        });
    };
    document.querySelectorAll('.import-filter-card').forEach(card => card.addEventListener('click', () => {
        document.querySelectorAll('.import-filter-card').forEach(other => other.classList.toggle('active', other === card));
        const show = shows[card.dataset.filter];
        document.querySelectorAll('tr[data-import-row]').forEach(row => { row.hidden = !show(row); });
    }));
});
</script>
