<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - SSJ</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='assets/css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0; min-height: 100vh; display: flex; justify-content: center; align-items: center;
            background: linear-gradient(135deg, #0f172a, #1e293b, #2a384d);
            overflow: hidden;
        }

        .bg-shape { position: absolute; border-radius: 50%; filter: blur(60px); z-index: 0; }
        .bg-shape-1 { width: 400px; height: 400px; background: rgba(255,255,255,0.2); top: -100px; left: -100px; }
        .bg-shape-2 { width: 500px; height: 500px; background: rgba(59, 130, 246, 0.4); bottom: -150px; right: -100px; }

        .glass-card {
            position: relative; z-index: 1;
            width: 460px; max-width: 92%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 24px; box-shadow: 0 25px 45px rgba(0, 0, 0, 0.2);
            padding: 50px;
            color: white;
        }

        .page-icon {
            width: 64px; height: 64px; border-radius: 16px;
            background: rgba(74, 222, 128, 0.15); border: 1px solid rgba(74, 222, 128, 0.3);
            display: flex; align-items: center; justify-content: center;
            font-size: 28px; margin-bottom: 24px; color: #86efac;
        }

        .glass-card h2 { margin: 0 0 4px 0; font-size: 26px; font-weight: 700; }
        .glass-card p { color: rgba(255,255,255,0.7); font-size: 14px; margin: 0 0 28px 0; line-height: 1.5; }

        .alert {
            padding: 12px 16px; border-radius: 10px; margin-bottom: 20px;
            font-size: 13px; display: flex; align-items: center; gap: 10px;
            backdrop-filter: blur(10px);
        }
        .alert-danger {
            background: rgba(248, 113, 113, 0.1); border: 1px solid rgba(248, 113, 113, 0.3); color: #fca5a5;
        }
        .alert-success {
            background: rgba(74, 222, 128, 0.1); border: 1px solid rgba(74, 222, 128, 0.3); color: #86efac;
        }

        .form-group { margin-bottom: 20px; }
        .form-label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; color: rgba(255,255,255,0.9); }
        .form-control {
            width: 100%; padding: 12px 16px; background: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(255,255,255,0.5); border-radius: 10px;
            font-size: 14px; color: #1e293b; outline: none; transition: 0.3s;
            box-sizing: border-box;
        }
        .form-control:focus { background: #ffffff; box-shadow: 0 0 0 4px rgba(255,255,255,0.3); }

        .pw-strength {
            height: 4px; border-radius: 2px; margin-top: 8px; transition: 0.3s;
            background: rgba(255,255,255,0.1);
        }
        .pw-strength-fill {
            height: 100%; border-radius: 2px; transition: width 0.3s, background 0.3s;
            width: 0%;
        }
        .pw-strength-label {
            font-size: 11px; margin-top: 4px; color: rgba(255,255,255,0.5); transition: 0.3s;
        }

        .btn-submit {
            width: 100%; padding: 14px; margin-top: 8px;
            background: #3b364c; color: white;
            border: 1px solid rgba(255,255,255,0.1); border-radius: 12px;
            font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.3s ease;
        }
        .btn-submit:hover {
            background: #4a4563; transform: translateY(-2px);
            box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.4); border-color: #60a5fa;
        }

        .match-indicator {
            font-size: 12px; margin-top: 6px; display: none;
        }
        .match-ok { color: #86efac; }
        .match-fail { color: #fca5a5; }

        @media (max-width: 768px) {
            .glass-card { padding: 32px 24px; }
            .form-control { font-size: 16px !important; }
        }
    </style>
    <script src="{{ url_for('static', filename='assets/js/password-reveal.js') }}" defer></script>
</head>
<body>
    <div class="bg-shape bg-shape-1"></div>
    <div class="bg-shape bg-shape-2"></div>

    <div class="glass-card">
        <div class="page-icon">
            <i class="fa-solid fa-lock-open"></i>
        </div>
        <h2>Reset Password</h2>
        <p>Your identity has been verified. Please create a new password for your account.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">
                        <i class="fa-solid {% if category == 'success' %}fa-check-circle{% else %}fa-circle-exclamation{% endif %}"></i>
                        <div>{{ message }}</div>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" id="resetForm">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label class="form-label">New Password</label>
                <input type="password" class="form-control" name="password" id="pw1" placeholder="At least 8 characters" minlength="8" required autofocus>
                <div class="pw-strength">
                    <div class="pw-strength-fill" id="strengthBar"></div>
                </div>
                <div class="pw-strength-label" id="strengthLabel"></div>
            </div>

            <div class="form-group">
                <label class="form-label">Confirm Password</label>
                <input type="password" class="form-control" name="confirm_password" id="pw2" placeholder="Type the new password again" required>
                <div class="match-indicator" id="matchIndicator"></div>
            </div>

            <button type="submit" class="btn-submit">
                <i class="fa-solid fa-key" style="margin-right: 8px;"></i>Reset Password
            </button>
        </form>
    </div>

    <script>
    // Password strength indicator
    const pw1 = document.getElementById('pw1');
    const pw2 = document.getElementById('pw2');
    const strengthBar = document.getElementById('strengthBar');
    const strengthLabel = document.getElementById('strengthLabel');
    const matchIndicator = document.getElementById('matchIndicator');

    pw1.addEventListener('input', function() {
        const val = this.value;
        let score = 0;
        if (val.length >= 8) score++;
        if (val.length >= 8) score++;
        if (/[A-Z]/.test(val) && /[a-z]/.test(val)) score++;
        if (/[0-9]/.test(val)) score++;
        if (/[^A-Za-z0-9]/.test(val)) score++;

        const levels = [
            { width: '0%', color: 'transparent', label: '' },
            { width: '20%', color: '#f87171', label: 'Very Weak' },
            { width: '40%', color: '#fb923c', label: 'Weak' },
            { width: '60%', color: '#fbbf24', label: 'Fair' },
            { width: '80%', color: '#4ade80', label: 'Strong' },
            { width: '100%', color: '#22d3ee', label: 'Very Strong' },
        ];

        const level = levels[Math.min(score, 5)];
        strengthBar.style.width = level.width;
        strengthBar.style.background = level.color;
        strengthLabel.textContent = level.label;
        strengthLabel.style.color = level.color;

        checkMatch();
    });

    pw2.addEventListener('input', checkMatch);

    function checkMatch() {
        if (!pw2.value) {
            matchIndicator.style.display = 'none';
            return;
        }
        matchIndicator.style.display = 'block';
        if (pw1.value === pw2.value) {
            matchIndicator.textContent = '✓ Passwords match';
            matchIndicator.className = 'match-indicator match-ok';
        } else {
            matchIndicator.textContent = '✗ Passwords do not match';
            matchIndicator.className = 'match-indicator match-fail';
        }
    }
    </script>
</body>
</html>
