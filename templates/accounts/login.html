<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SSJ</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='assets/css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f172a, #1e293b, #2a384d);
            overflow: hidden;
        }

        /* Ornamen background */
        .bg-shape {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            z-index: 0;
        }

        .bg-shape-1 {
            width: 400px;
            height: 400px;
            background: rgba(255, 255, 255, 0.2);
            top: -100px;
            left: -100px;
        }

        .bg-shape-2 {
            width: 500px;
            height: 500px;
            background: rgba(59, 130, 246, 0.4);
            bottom: -150px;
            right: -100px;
        }

        /* KARTU SPLIT SCREEN GLASSMORPHISM */
        .glass-split-container {
            position: relative;
            z-index: 1;
            display: flex;
            width: 1000px;
            max-width: 95%;
            min-height: 550px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 24px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        /* LEFT SIDE: FORM */
        .form-side {
            flex: 1;
            padding: 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: rgba(255, 255, 255, 0.05);
            border-right: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
        }

        .brand-logo {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-side h2 {
            margin: 0 0 1px 0;
            font-size: 28px;
        }

        .form-side p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
            margin-bottom: 30px;
        }

        /* FLASH MESSAGES ALERT */
        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(10px);
        }

        .alert-danger {
            background: rgba(248, 113, 113, 0.1);
            border: 1px solid rgba(248, 113, 113, 0.3);
            color: #fca5a5;
        }

        .alert-success {
            background: rgba(74, 222, 128, 0.1);
            border: 1px solid rgba(74, 222, 128, 0.3);
            color: #86efac;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            color: rgba(255, 255, 255, 0.9);
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 10px;
            font-size: 14px;
            color: #1e293b;
            outline: none;
            transition: 0.3s;
            box-sizing: border-box;
            /* Keep the padding from widening the input */
        }

        .form-control:focus {
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.3);
        }

        /* Button colour at rest */
        .btn-submit {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            background: #3b364c;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s ease;
        }

        .btn-submit:hover {
            background: #4a4563;
            transform: translateY(-2px);
            box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.4);
            border-color: #60a5fa;
        }

        .btn-submit:focus {
            outline: none;
            box-shadow: 0 0 0 4px rgba(96, 165, 250, 0.6);
        }

        /* RIGHT SIDE: VISUAL / ILLUSTRATION */
        .visual-side {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.05);
            position: relative;
            padding: 40px;
            text-align: center;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .glass-split-container {
                flex-direction: column;
            }

            .form-side {
                padding: 32px 24px;
                /* Reduce the 50px padding, too large for phones */
                border-right: none;
            }

            .visual-side {
                display: none;
            }

            .form-control {
                font-size: 16px !important;
                /* Prevent auto-zoom while typing in iOS Safari */
            }
        }
    </style>
    <script src="{{ url_for('static', filename='assets/js/password-reveal.js') }}" defer></script>
</head>

<body>
    <div class="bg-shape bg-shape-1"></div>
    <div class="bg-shape bg-shape-2"></div>

    <div class="glass-split-container">
        <div class="form-side">
            <h2>SSJ Login</h2>
            <p>Please sign in with your system credentials.</p>

            <!-- FLASK ERROR MESSAGES -->
            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            {% for category, message in messages %}
            <div class="alert alert-{{ category }}">
                <i class="fa-solid fa-circle-exclamation"></i>
                <div>{{ message }}</div>
            </div>
            {% endfor %}
            {% endif %}
            {% endwith %}

            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="form-group">
                    <label class="form-label">Username or Email</label>
                    <input type="text" class="form-control" name="username" placeholder="Enter username / email"
                        required autofocus>
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" name="password" placeholder="Enter password"
                        required>
                </div>
                <button type="submit" class="btn-submit">Sign In</button>
                <div style="text-align: center; margin-top: 16px;">
                    <a href="{{ url_for('auth.forgot_password') }}"
                        style="color: rgba(255,255,255,0.6); font-size: 13px; text-decoration: none; transition: 0.2s;"
                        onmouseover="this.style.color='rgba(255,255,255,0.9)'"
                        onmouseout="this.style.color='rgba(255,255,255,0.6)'">
                        Forgot Password?
                    </a>
                </div>
            </form>
        </div>

        <div class="visual-side">
            <div class="brand-logo">
                <img src="{{ url_for('static', filename='assets/images/logo.png') }}" alt="SSJ logo"
                    style="height: 200px; width: auto;">
            </div>
        </div>
    </div>
</body>

</html>
